[project]
name = "skn-proj2"
version = "0.1.0"
description = "YouTube 크리에이터 이탈 위험도 예측 AI 모델"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    # 데이터 수집
    "requests>=2.31.0",
    "beautifulsoup4>=4.12.0",
    "selenium>=4.15.0",
    "google-api-python-client>=2.100.0",
    "python-dotenv>=1.0.0",
    # 데이터 처리
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "scikit-learn>=1.3.0",
    "imbalanced-learn>=0.11.0",
    # ML 모델
    "xgboost>=2.0.0",
    "lightgbm>=4.1.0",
    # 시각화·해석
    "matplotlib>=3.7.0",
    "seaborn>=0.12.0",
    "plotly>=5.18.0",
    "shap>=0.43.0",
    # 앱
    "streamlit>=1.29.0",
    "qrcode[pil]>=7.4.2",
    # 설정·로깅
    "pyyaml>=6.0.0",
    # 노트북
    "jupyter>=1.0.0",
    "ipykernel>=6.25.0",
    "pymysql>=1.2.0",
    "sqlalchemy<2.0.49",
    "torch>=2.0.1",
    "transformers>=4.57.6",
    "dotenv>=0.9.9",
]

[project.optional-dependencies]
dl = [
    "torch>=2.0.0",
    "transformers>=4.35.0",
    "sentencepiece>=0.1.99",
]
